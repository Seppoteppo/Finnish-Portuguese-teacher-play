<template id="etusivu-pohja">
  <header class="op-otsake etusivu-otsake">
    <p class="yla">Curso de finlandês para quem fala português</p>
    <h1>Totta<i>kai</i>!</h1>
    <p class="lahde-rivi">O nome vem de <span class="fi">totta kai</span>, que quer dizer “claro!”, “com certeza!”. Este curso acompanha Maia, geóloga de Belo Horizonte, que mora em Helsinque e aprende finlandês com o namorado, Jay. Ela ensina português a ele; ele ensina finlandês a ela. Você aprende junto com a Maia, na mesma ordem.</p>
    <p class="etusivu-aloitus"><a class="paanappi" id="aloita" href="#t00">Começar pela lição 0</a></p>
  </header>

  <section class="osio hoje" id="hoje" hidden>
    <h2>Hoje</h2>
  </section>

  <section class="osio">
    <h2>Como funciona</h2>
    <ul class="ohjeet ohjeet-lyhyt">
      <li><span class="ohje-ikoni" aria-hidden="true">👆</span><span><b>Toque numa palavra</b> (no computador: passe o mouse): aparecem o significado, a pronúncia e a forma básica. O som toca no <b>▶</b>. Experimente: <span class="fi">Helsingissä</span>.</span></li>
      <li><span class="ohje-ikoni" aria-hidden="true">📘</span><span><b>Cada lição</b> tem diálogo, explicação e os exercícios da Manaattila (a área de exercícios do Peixe-boi); depois vêm a <b>Gramática da lição</b>, o <b>Treino</b> e o <b>quiz</b>. Ouça o diálogo primeiro sem a <b>Tradução</b>.</span></li>
      <li><span class="ohje-ikoni" aria-hidden="true">🍊</span><span><b>Mandarinas:</b> cada acerto de primeira vale uma, cada lição terminada dá uma medalha (bronze, prata ou ouro) e voltar todo dia vale mais. Errar não tira nada. Na lojinha da ilha você compra coisas para o Capivara e o Peixe-boi: rede, coqueiro, camisas do Cruzeiro…</span></li>
    </ul>
  </section>

  <section class="osio">
    <h2>Som</h2>
    <p class="aanitila">Carregando…</p>
    <p class="s" data-h="kertoja" data-pt="Oi! Bem-vindo ao curso de finlandês.">Moi! Tervetuloa suomen kurssille.</p>
    <p>Não ouviu nada? <button class="tyonappi" type="button" id="aanitesti">Testar o som</button></p>
    <div id="aanitesti-tulos" class="aanitesti-tulos" aria-live="polite"></div>
  </section>

  <section class="osio">
    <h2>Lições</h2>
    <ul id="oppituntilista"></ul>
  </section>

  <section class="osio">
    <h2>De onde vem este curso</h2>
    <p>A ordem da gramática e da pronúncia segue o que os livros de finlandês para estrangeiros têm em comum, corrigida pelo que professores e alunos estrangeiros dizem que funciona (por exemplo: a gradação consonantal desde o começo, e a pronúncia pensada para quem fala português). A história, as pessoas, os diálogos e os exercícios são deste curso; os lugares são reais. As 1000 palavras vêm de uma contagem do finlandês falado em legendas (OpenSubtitles).</p>
    <p><a href="#creditos">Créditos das fotos</a></p>
  </section>
